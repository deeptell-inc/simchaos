[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simchaos"
version = "1.0.0"
description = "Tomography-free quantum diagnostics of dissipative quantum chaos: models, diagnostics, decision rule, and reproduction scripts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["models", "diagnostics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
